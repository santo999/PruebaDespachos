services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: Despachos-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - Despachos-net

  backend:
    build:
      context: ./backend
      dockerfile: src/Despachos.Api/Dockerfile
    container_name: Despachos-backend
    depends_on:
      db:
        
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=DespachosDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT}"
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - Despachos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        
        API_BASE_URL: "http://localhost:${BACKEND_PORT}/api"
    container_name: Despachos-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - Despachos-net

networks:
  Despachos-net:
    driver: bridge

volumes:
  sqlserver_data:
